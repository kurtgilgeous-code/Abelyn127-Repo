services:
  - type: web
    name: tampisawan-booking
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    buildCommand: npm ci --include=dev && npm --prefix server ci --include=dev && npm run build && npm run build:server
    startCommand: npm --prefix server run start
    healthCheckPath: /api/health
    disk:
      name: payment-proofs
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_PROOF_DIR
        value: /var/data/payment-proofs
      - key: DATABASE_URL
        fromDatabase:
          name: tampisawan-booking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: tampisawan-booking-db
    databaseName: tampisawan
    user: tampisawan
    plan: basic-1gb
    region: singapore
    postgresMajorVersion: "16"
